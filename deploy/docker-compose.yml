# Production stack on one EC2 instance: Caddy (HTTPS) → frontend (Next.js) + backend (FastAPI).
# Run from the repo root on the server:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  backend:
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    env_file: ../.env.server
    environment:
      DATA_DIR: /data
    volumes:
      - ../data-volume:/data          # SQLite (API cache, results) + uploaded documents; survives rebuilds
    restart: unless-stopped
    mem_limit: 5g
    networks:
      default:
      claw:
        ipv4_address: 172.30.0.10

  # AutoResearchClaw runs model-written experiment code, so it lives in its own container:
  # no app secrets, no data volume, non-root, and the host firewall blocks it from the cloud metadata endpoint.
  autoclaw:
    build: { context: .., dockerfile: deploy/autoclaw.Dockerfile }
    env_file: ../.env.claw
    networks:
      claw:
        ipv4_address: 172.30.0.20
    restart: unless-stopped
    mem_limit: 3g
    cpus: 1.5
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  frontend:
    build: { context: .., dockerfile: deploy/frontend.Dockerfile }
    restart: unless-stopped
    depends_on: [backend]

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.generated:/etc/caddy/Caddyfile:ro
      - caddy_data:/data              # TLS certificates
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [frontend, backend]

networks:
  claw:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
